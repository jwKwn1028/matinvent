# Fast, structure-only Na-ion conductor reward for RL exploration.
_target_: rewards.reward.Reward

root_dir: rewards/sodium_ionic_conductor

calculator:
  _target_: rewards.calculators.IonicConductivity
  root_dir: rewards/sodium_ionic_conductor/descriptors
  mobile_species:
    - Na
  temperature_k: 298.15
  hop_cutoff: 4.5
  strict: false

prop_cfg:
  - name: transport_score
    target: ascending
    minv: 0.15
    maxv: 0.75
    weight: 0.55
  - name: mobile_sublattice_dimensionality
    target: ascending
    minv: 0.0
    maxv: 3.0
    weight: 0.20
  - name: short_contact_score
    target: ascending
    minv: 0.50
    maxv: 1.0
    weight: 0.15
  - name: mobile_fraction
    target: 0.22
    minv: 0.0
    maxv: 0.20
    weight: 0.10

constraint_cfg:
  - name: mobile_fraction
    min: 0.03
    penalty: 0.0
  - name: short_contact_score
    min: 0.25
    penalty: 0.0

reduce: weight
reward_threshold: 0.72
