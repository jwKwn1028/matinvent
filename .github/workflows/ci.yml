name: lightweight-ci

on:
  push:
  pull_request:

jobs:
  descriptors-and-rewards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install lightweight development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint specialized workflow
        run: >-
          ruff check
          rewards/calculators/ionic
          rewards/calculators/__init__.py
          rewards/calculators/base.py
          rewards/reward.py
          models/mattergen/sample.py
          pipeline/base.py
          pipeline/mat_invent.py
          main.py
          scripts/fit_ionic_surrogate.py
          scripts/screen_candidates.py
          tests
      - name: Compile Python sources
        run: python -m compileall -q models rewards pipeline scripts tests
      - name: Run lightweight tests
        run: python -m unittest discover -s tests -v
